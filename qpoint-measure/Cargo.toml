[package]
name = "qpoint-measure"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg", "tokio"] }
iter_num_tools = "0.7"
kuva = "0.6"
native-dialog = { version = "0.9", features = ["async"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "fs", "io-util", "sync", "time"] }
tokio-serial = "5.5"

qpoint-common = { path = "../qpoint-common", features = ["std"] }
