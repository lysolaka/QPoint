[package]
name = "qpoint-firmware"
version = "0.1.0-dev.1"
edition = "2024"

[dependencies]
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", features = ["rt", "defmt", "unstable-pac", "time", "time-driver-tim15", "stm32g0b1ce"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["defmt", "tick-hz-32_768"] }

assign-resources = "0.5"
critical-section = "1.2"
libm = "0.2"
portable-atomic = { version = "1.15", default-features = false, features = ["unsafe-assume-single-core"] }
static_cell = "2.1"

qpoint-common = { path = "../qpoint-common", features = ["defmt"] }

[profile.dev]
codegen-units = 1
debug = true
incremental = false
opt-level = "s"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = "s"
